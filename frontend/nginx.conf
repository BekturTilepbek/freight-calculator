server {
    listen 80;
    server_name _;

    # Корень — собранная Vue-статика
    root /usr/share/nginx/html;
    index index.html;

    # Лимит размера запроса (на случай загрузки документов в будущем)
    client_max_body_size 10M;

    # Gzip-сжатие для скорости
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA-fallback: любые маршруты ведут на index.html
    # Это нужно для работы Vue Router в режиме history
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеш для статики (JS, CSS, шрифты, картинки)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Проксирование API на backend-контейнер
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Таймауты — некоторые операции (геокодинг) могут идти 5-10 секунд
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Доступ к Swagger UI в проде (полезно для демо на защите)
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Безопасность: скрываем версию Nginx
    server_tokens off;

    # Базовые security-заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}