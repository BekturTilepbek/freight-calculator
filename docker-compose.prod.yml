services:
  postgres:
    image: postgres:16-alpine
    container_name: freightflow_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт НЕ пробрасываем наружу — БД доступна только из Docker-сети
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freightflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: freightflow_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freightflow
    # Порт наружу не пробрасываем — frontend (Nginx) сам достучится через docker-сеть

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: freightflow_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - freightflow

volumes:
  postgres_data:

networks:
  freightflow:
    driver: bridge